name: Publish tested release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/release.yml]
permissions:
  contents: write
concurrency:
  group: publish-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- dist
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - name: Select version
        run: |
          node - <<'JS'
          const fs = require('fs');
          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Invalid release version');
          fs.appendFileSync(process.env.GITHUB_ENV, `RELEASE_TAG=v${version}\n`);
          JS
      - name: Build installation and source archives
        run: |
          zip -r "dunk-music-$RELEASE_TAG.zip" dist themes examples docs README.md CHANGELOG.md LICENSE hacs.json
          git archive --format=zip --prefix=dunk-music-card/ -o "dunk-music-source-$RELEASE_TAG.zip" HEAD
          cp dist/dunk-music.js dunk-music.js
          sha256sum dunk-music.js "dunk-music-$RELEASE_TAG.zip" "dunk-music-source-$RELEASE_TAG.zip" > SHA256SUMS.txt
      - name: Upload assets then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release-status.json 2>/dev/null; then
            node -e 'if (!JSON.parse(require("fs").readFileSync("release-status.json", "utf8")).isDraft) { throw new Error("Refusing to replace a published release"); }'
            gh release edit "$RELEASE_TAG" --draft --target "$GITHUB_SHA" --title "Dunk Music $RELEASE_TAG" --notes-file "docs/RELEASE-$RELEASE_TAG.md"
          else
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" --title "Dunk Music $RELEASE_TAG" --notes-file "docs/RELEASE-$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" dunk-music.js "dunk-music-$RELEASE_TAG.zip" "dunk-music-source-$RELEASE_TAG.zip" SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
